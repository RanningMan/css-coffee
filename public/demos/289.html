
<!DOCTYPE html>
<html>
<head>
  <title>Demo: CSS scroll-padding-block-start</title>
  <style>
    /* Reset and base styles */
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      overflow: hidden;
    }
    
    /* Layout */
    .playground-container {
      display: flex;
      justify-content: space-between;
      padding: 20px;
      box-sizing: border-box;
      max-height: 100vh;
    }
    
    /* Code panel */
    .code-panel {
      width: 40%;
      border: 1px solid #eee;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 40px);
    }
    
    .tabs {
      display: flex;
      background: #f5f5f5;
      border-bottom: 1px solid #eee;
    }
    
    .tab {
      padding: 10px 20px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 14px;
    }
    
    .tab.active {
      background: white;
      border-bottom: 2px solid #0066cc;
    }
    
    .code-content {
      padding: 20px;
      display: none;
      background: white;
      white-space: pre-wrap;
      font-family: 'Courier New', Courier, monospace;
      width: 100%;
      box-sizing: border-box;
      border: none;
      outline: none;
      resize: none;
      flex: 1;
      overflow-y: auto;
    }
    
    .code-content.active {
      display: block;
    }
    
    /* Demo panel */
    .demo-panel {
      width: 50%;
      border: 1px solid #eee;
      border-radius: 4px;
      padding: 20px;
      overflow: auto;
    }

    /* Custom demo styles */
    .container {
  height: 200vh; /* Make the container tall enough to scroll */
  padding: 20px;
  scroll-padding-block-start: 100px; /* Set padding for scroll position */
}

h1 {
  margin-top: 100px; /* Space between sections */
}

nav {
  position: fixed;
  top: 10px;
  background: rgba(255, 255, 255, 0.8);
  padding: 10px;
  border-radius: 5px;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
}

p {
  margin: 20px 0;
}
  </style>
  <script>
    function updatePreview() {
      const htmlCode = document.getElementById('html-code').value;
      const cssCode = document.getElementById('css-code').value;
      const jsCode = document.getElementById('js-code').value;

      const preview = document.getElementById('demo-preview');
      const styleTag = document.getElementById('demo-style');
      const scriptTag = document.getElementById('demo-script');

      // Update HTML
      preview.innerHTML = htmlCode;

      // Update CSS
      styleTag.textContent = cssCode;

      // Update JavaScript
      try {
        // Remove old script if exists
        const oldScript = document.getElementById('demo-dynamic-script');
        if (oldScript) oldScript.remove();

        // Create and add new script
        if (jsCode.trim()) {
          const script = document.createElement('script');
          script.id = 'demo-dynamic-script';
          script.textContent = jsCode;
          document.body.appendChild(script);
        }
      } catch (error) {
        console.error('JavaScript error:', error);
      }
    }

    function switchTab(tabName) {
      // Hide all code content
      document.querySelectorAll('.code-content').forEach(content => {
        content.classList.remove('active');
      });
      
      // Deactivate all tabs
      document.querySelectorAll('.tab').forEach(tab => {
        tab.classList.remove('active');
      });
      
      // Show selected content and activate tab
      document.getElementById(tabName + '-code').classList.add('active');
      document.getElementById(tabName + '-tab').classList.add('active');
    }

    // Add input event listeners after DOM loads
    document.addEventListener('DOMContentLoaded', function() {
      ['html-code', 'css-code', 'js-code'].forEach(id => {
        document.getElementById(id).addEventListener('input', updatePreview);
      });
    });
  </script>
</head>
<body>
  <div class="playground-container">
    <div class="code-panel">
      <div class="tabs">
        <button id="html-tab" class="tab" onclick="switchTab('html')">HTML</button>
        <button id="css-tab" class="tab active" onclick="switchTab('css')">CSS</button>
        <button id="js-tab" class="tab" onclick="switchTab('js')">JavaScript</button>
      </div>
      <textarea id="html-code" class="code-content" spellcheck="false">&lt;div class=&#039;container&#039;&gt;
  &lt;h1 id=&#039;section1&#039;&gt;Section 1&lt;/h1&gt;
  &lt;p&gt;This is the first section of content.&lt;/p&gt;
  &lt;h1 id=&#039;section2&#039;&gt;Section 2&lt;/h1&gt;
  &lt;p&gt;This is the second section of content.&lt;/p&gt;
  &lt;h1 id=&#039;section3&#039;&gt;Section 3&lt;/h1&gt;
  &lt;p&gt;This is the third section of content.&lt;/p&gt;
  &lt;nav&gt;
    &lt;a href=&#039;#section1&#039;&gt;Go to Section 1&lt;/a&gt; | 
    &lt;a href=&#039;#section2&#039;&gt;Go to Section 2&lt;/a&gt; | 
    &lt;a href=&#039;#section3&#039;&gt;Go to Section 3&lt;/a&gt;
  &lt;/nav&gt;
&lt;/div&gt;</textarea>
      <textarea id="css-code" class="code-content active" spellcheck="false">.container {
  height: 200vh; /* Make the container tall enough to scroll */
  padding: 20px;
  scroll-padding-block-start: 100px; /* Set padding for scroll position */
}

h1 {
  margin-top: 100px; /* Space between sections */
}

nav {
  position: fixed;
  top: 10px;
  background: rgba(255, 255, 255, 0.8);
  padding: 10px;
  border-radius: 5px;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
}

p {
  margin: 20px 0;
}</textarea>
      <textarea id="js-code" class="code-content" spellcheck="false">// No JavaScript required for this demo</textarea>
    </div>
    <div class="demo-panel">
      <style id="demo-style">
        .container {
  height: 200vh; /* Make the container tall enough to scroll */
  padding: 20px;
  scroll-padding-block-start: 100px; /* Set padding for scroll position */
}

h1 {
  margin-top: 100px; /* Space between sections */
}

nav {
  position: fixed;
  top: 10px;
  background: rgba(255, 255, 255, 0.8);
  padding: 10px;
  border-radius: 5px;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
}

p {
  margin: 20px 0;
}
      </style>
      <div id="demo-preview">
        <div class='container'>
  <h1 id='section1'>Section 1</h1>
  <p>This is the first section of content.</p>
  <h1 id='section2'>Section 2</h1>
  <p>This is the second section of content.</p>
  <h1 id='section3'>Section 3</h1>
  <p>This is the third section of content.</p>
  <nav>
    <a href='#section1'>Go to Section 1</a> | 
    <a href='#section2'>Go to Section 2</a> | 
    <a href='#section3'>Go to Section 3</a>
  </nav>
</div>
      </div>
    </div>
  </div>
</body>
</html>
