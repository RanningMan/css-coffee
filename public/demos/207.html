
<!DOCTYPE html>
<html>
<head>
  <title>Demo: CSS mask-border-slice</title>
  <style>
    /* Reset and base styles */
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      overflow: hidden;
    }
    
    /* Layout */
    .playground-container {
      display: flex;
      justify-content: space-between;
      padding: 20px;
      box-sizing: border-box;
      max-height: 100vh;
    }
    
    /* Code panel */
    .code-panel {
      width: 40%;
      border: 1px solid #eee;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 40px);
    }
    
    .tabs {
      display: flex;
      background: #f5f5f5;
      border-bottom: 1px solid #eee;
    }
    
    .tab {
      padding: 10px 20px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 14px;
    }
    
    .tab.active {
      background: white;
      border-bottom: 2px solid #0066cc;
    }
    
    .code-content {
      padding: 20px;
      display: none;
      background: white;
      white-space: pre-wrap;
      font-family: 'Courier New', Courier, monospace;
      width: 100%;
      box-sizing: border-box;
      border: none;
      outline: none;
      resize: none;
      flex: 1;
      overflow-y: auto;
    }
    
    .code-content.active {
      display: block;
    }
    
    /* Demo panel */
    .demo-panel {
      width: 50%;
      border: 1px solid #eee;
      border-radius: 4px;
      padding: 20px;
      overflow: auto;
    }

    /* Custom demo styles */
    .masked-border { 
  width: 200px; 
  height: 100px; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  font-size: 24px; 
  color: white; 
  background-color: #3498db; 
  mask-border-source: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100"><rect width="200" height="100" fill="white"/><circle cx="100" cy="50" r="40" fill="black"/></svg>'); 
  mask-border-slice: 20; 
  mask-border-width: 20px; 
  mask-border-outset: 0; 
  mask-type: alpha; 
  -webkit-mask-border-source: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100"><rect width="200" height="100" fill="white"/><circle cx="100" cy="50" r="40" fill="black"/></svg>'); 
  -webkit-mask-border-slice: 20; 
  -webkit-mask-border-width: 20px; 
  -webkit-mask-border-outset: 0; 
  -webkit-mask-type: alpha; 
}
  </style>
  <script>
    function updatePreview() {
      const htmlCode = document.getElementById('html-code').value;
      const cssCode = document.getElementById('css-code').value;
      const jsCode = document.getElementById('js-code').value;

      const preview = document.getElementById('demo-preview');
      const styleTag = document.getElementById('demo-style');
      const scriptTag = document.getElementById('demo-script');

      // Update HTML
      preview.innerHTML = htmlCode;

      // Update CSS
      styleTag.textContent = cssCode;

      // Update JavaScript
      try {
        // Remove old script if exists
        const oldScript = document.getElementById('demo-dynamic-script');
        if (oldScript) oldScript.remove();

        // Create and add new script
        if (jsCode.trim()) {
          const script = document.createElement('script');
          script.id = 'demo-dynamic-script';
          script.textContent = jsCode;
          document.body.appendChild(script);
        }
      } catch (error) {
        console.error('JavaScript error:', error);
      }
    }

    function switchTab(tabName) {
      // Hide all code content
      document.querySelectorAll('.code-content').forEach(content => {
        content.classList.remove('active');
      });
      
      // Deactivate all tabs
      document.querySelectorAll('.tab').forEach(tab => {
        tab.classList.remove('active');
      });
      
      // Show selected content and activate tab
      document.getElementById(tabName + '-code').classList.add('active');
      document.getElementById(tabName + '-tab').classList.add('active');
    }

    // Add input event listeners after DOM loads
    document.addEventListener('DOMContentLoaded', function() {
      ['html-code', 'css-code', 'js-code'].forEach(id => {
        document.getElementById(id).addEventListener('input', updatePreview);
      });
    });
  </script>
</head>
<body>
  <div class="playground-container">
    <div class="code-panel">
      <div class="tabs">
        <button id="html-tab" class="tab" onclick="switchTab('html')">HTML</button>
        <button id="css-tab" class="tab active" onclick="switchTab('css')">CSS</button>
        <button id="js-tab" class="tab" onclick="switchTab('js')">JavaScript</button>
      </div>
      <textarea id="html-code" class="code-content" spellcheck="false">&lt;div class=&#039;masked-border&#039;&gt;Hello, World!&lt;/div&gt;</textarea>
      <textarea id="css-code" class="code-content active" spellcheck="false">.masked-border { 
  width: 200px; 
  height: 100px; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  font-size: 24px; 
  color: white; 
  background-color: #3498db; 
  mask-border-source: url(&#039;data:image/svg+xml;utf8,&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;200&quot; height=&quot;100&quot;&gt;&lt;rect width=&quot;200&quot; height=&quot;100&quot; fill=&quot;white&quot;/&gt;&lt;circle cx=&quot;100&quot; cy=&quot;50&quot; r=&quot;40&quot; fill=&quot;black&quot;/&gt;&lt;/svg&gt;&#039;); 
  mask-border-slice: 20; 
  mask-border-width: 20px; 
  mask-border-outset: 0; 
  mask-type: alpha; 
  -webkit-mask-border-source: url(&#039;data:image/svg+xml;utf8,&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;200&quot; height=&quot;100&quot;&gt;&lt;rect width=&quot;200&quot; height=&quot;100&quot; fill=&quot;white&quot;/&gt;&lt;circle cx=&quot;100&quot; cy=&quot;50&quot; r=&quot;40&quot; fill=&quot;black&quot;/&gt;&lt;/svg&gt;&#039;); 
  -webkit-mask-border-slice: 20; 
  -webkit-mask-border-width: 20px; 
  -webkit-mask-border-outset: 0; 
  -webkit-mask-type: alpha; 
}</textarea>
      <textarea id="js-code" class="code-content" spellcheck="false">// No JavaScript required for this demo</textarea>
    </div>
    <div class="demo-panel">
      <style id="demo-style">
        .masked-border { 
  width: 200px; 
  height: 100px; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  font-size: 24px; 
  color: white; 
  background-color: #3498db; 
  mask-border-source: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100"><rect width="200" height="100" fill="white"/><circle cx="100" cy="50" r="40" fill="black"/></svg>'); 
  mask-border-slice: 20; 
  mask-border-width: 20px; 
  mask-border-outset: 0; 
  mask-type: alpha; 
  -webkit-mask-border-source: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100"><rect width="200" height="100" fill="white"/><circle cx="100" cy="50" r="40" fill="black"/></svg>'); 
  -webkit-mask-border-slice: 20; 
  -webkit-mask-border-width: 20px; 
  -webkit-mask-border-outset: 0; 
  -webkit-mask-type: alpha; 
}
      </style>
      <div id="demo-preview">
        <div class='masked-border'>Hello, World!</div>
      </div>
    </div>
  </div>
</body>
</html>
